<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKKE · 立绘 / Spine 查看器</title>
<link rel="stylesheet" href="../../shared/vendor/spine-player.css">
<style>
  :root{
    --abyss:#12080e; --deep:#1e0f16; --panel:#2a1620;
    --foam:#c79bb0; --foam-dim:#8f6478;
    --accent:#e0455f; --accent-lit:#ff6b82; --accent-dim:rgba(224,69,95,.14);
    --ivory:#f3eef0; --line:rgba(199,155,176,.14); --line-lit:rgba(199,155,176,.3);
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    --page-x:clamp(1rem,3.5vw,2.6rem); --header-h:66px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1300px 760px at 82% -12%, rgba(224,69,95,.18), transparent 60%),
      radial-gradient(1000px 640px at -5% 108%, rgba(224,69,95,.08), transparent 55%),
      var(--abyss);
    color:var(--ivory); font-family:var(--sans); min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex; align-items:center; gap:1.2rem; height:var(--header-h);
    padding:0 var(--page-x); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,rgba(18,8,14,.96),rgba(18,8,14,.82));
    backdrop-filter:blur(10px);
  }
  .home-link{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.24em; color:var(--accent);
    border:1px solid var(--accent); padding:.28rem .5rem; border-radius:2px;
    text-transform:uppercase; text-decoration:none; transition:.15s;
  }
  .home-link:hover{background:var(--accent); color:var(--abyss)}
  h1{font-size:1.28rem; font-weight:600; letter-spacing:.02em}
  h1 small{display:block; font-family:var(--mono); font-size:.66rem; color:var(--foam);
    letter-spacing:.18em; margin-top:.2rem; font-weight:400}

  .gallery-head{display:flex; align-items:center; gap:1rem; margin-bottom:1.6rem; flex-wrap:wrap}
  .gallery-head h2{font-size:1rem; font-weight:600; letter-spacing:.04em}
  .gallery-head span{font-family:var(--mono); font-size:.72rem; color:var(--foam); letter-spacing:.12em}
  .search{
    font-family:var(--mono); font-size:.78rem; background:rgba(18,8,14,.6);
    border:1px solid var(--line); color:var(--ivory); padding:.5rem .7rem;
    border-radius:4px; outline:none;
  }
  .search:focus{border-color:var(--accent)}
  .search::placeholder{color:var(--foam); opacity:.5}

  #grid-view{padding:1.9rem var(--page-x) 2.6rem}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:1rem}
  .card{
    background:linear-gradient(180deg,rgba(42,22,32,.5),rgba(30,15,22,.3)),
      repeating-conic-gradient(#1b0e15 0% 25%,#241119 0% 50%) 50%/22px 22px;
    border:1px solid var(--line); border-radius:6px; overflow:hidden;
    cursor:pointer; transition:.2s; position:relative;
  }
  .card:hover{border-color:var(--accent); transform:translateY(-3px)}
  .card .thumb{height:230px; display:grid; place-items:center; padding:.6rem; position:relative}
  .card img{max-width:100%; max-height:100%; object-fit:contain;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.4))}
  .card .name{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; color:var(--foam);
    padding:.6rem .7rem; border-top:1px solid var(--line);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .card .badge{
    position:absolute; top:.5rem; right:.5rem; font-family:var(--mono); font-size:.6rem;
    letter-spacing:.06em; color:var(--abyss); background:var(--accent);
    padding:.15rem .4rem; border-radius:3px; font-weight:600;
  }
  .card .poses{
    position:absolute; bottom:.5rem; left:.5rem; display:flex; gap:.25rem;
  }
  .card .poses i{
    font-family:var(--mono); font-size:.54rem; font-style:normal; letter-spacing:.05em;
    background:rgba(18,8,14,.72); color:var(--foam); padding:.12rem .32rem; border-radius:3px;
    border:1px solid var(--line);
  }
  .card .poses i.hl{background:var(--accent); color:var(--abyss); border-color:var(--accent); font-weight:600}

  #stage-view{height:calc(100vh - var(--header-h)); position:relative; display:none}
  .back-btn{
    /* z-index 19：必须高于皮肤对比面板（.sc-panel z-index:18），
       否则对比模式下「返回列表」被面板完全遮挡，真实点击不可达。 */
    position:absolute; top:1.2rem; left:1.4rem; z-index:19;
    font-family:var(--mono); font-size:.78rem; letter-spacing:.06em;
    background:rgba(42,22,32,.82); border:1px solid var(--line); color:var(--foam);
    padding:.5rem .9rem; border-radius:4px; cursor:pointer; backdrop-filter:blur(6px); transition:.15s;
  }
  .back-btn:hover{border-color:var(--accent); color:var(--accent-lit)}
  .stage{position:relative; overflow:hidden; height:100%}
  #player-container{position:absolute; inset:0}
  /* spine-player 自带控件的暗色适配 */
  #player-container .spine-player{background:transparent!important}
  /* 关键：让 spine-player 画布填满容器，否则退化成 300x150 */
  #player-container .spine-player-canvas,
  #player-container canvas{width:100%!important; height:100%!important; display:block}
  .loading{
    position:absolute; inset:0; display:none; place-items:center; z-index:6;
    font-family:var(--mono); font-size:.8rem; letter-spacing:.2em; color:var(--foam);
    pointer-events:none;
  }
  .loading.on{display:grid}
  .loading::after{content:""; width:34px; height:34px; margin-left:14px;
    border:2px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite; display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{color:var(--accent-lit)}

  .pose-tabs{
    position:absolute; top:1.2rem; left:50%; transform:translateX(-50%); z-index:8;
    display:flex; gap:.4rem; background:rgba(30,15,22,.7); padding:.35rem;
    border:1px solid var(--line); border-radius:6px; backdrop-filter:blur(6px);
  }
  .pose-tabs button{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; color:var(--foam);
    background:transparent; border:1px solid transparent; padding:.35rem .8rem;
    border-radius:4px; cursor:pointer; transition:.15s;
  }
  .pose-tabs button:hover{color:var(--accent-lit)}
  .pose-tabs button.on{background:var(--accent); color:var(--abyss); font-weight:600}
  .stage-hint{
    position:absolute; left:1.4rem; bottom:1.3rem; font-family:var(--mono);
    font-size:.7rem; letter-spacing:.1em; color:var(--foam); opacity:.7;
    pointer-events:none; line-height:1.7; z-index:7;
  }
  .stage-hint b{color:var(--accent); font-weight:600}
  .ver-badge{
    position:absolute; top:1.2rem; right:1.4rem; z-index:8; font-family:var(--mono);
    font-size:.64rem; letter-spacing:.08em; color:var(--foam);
    background:rgba(30,15,22,.7); border:1px solid var(--line);
    padding:.3rem .55rem; border-radius:4px;
  }

  /* 动作控制台：右上角折叠抽屉 + 紧凑网格（参考 azur_lane live2d 动作面板）*/
  .motions{
    position:absolute; top:3.4rem; right:1.4rem; z-index:9;
    display:flex; flex-direction:column; align-items:flex-end; gap:.5rem;
    pointer-events:none;
  }
  .motions .m-toggle{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.08em;
    background:rgba(30,15,22,.88); border:1px solid var(--line-lit); color:var(--foam);
    padding:.5rem .9rem; border-radius:6px; cursor:pointer; transition:.15s;
    backdrop-filter:blur(10px); white-space:nowrap; display:inline-flex;
    align-items:center; gap:.5rem; box-shadow:0 6px 18px rgba(0,0,0,.35);
    pointer-events:auto;
  }
  .motions .m-toggle:hover{border-color:var(--accent); color:var(--accent-lit)}
  .motions .m-toggle .caret{transition:transform .2s; font-size:.66rem; opacity:.8}
  .motions.open .m-toggle{border-color:var(--accent); color:var(--accent-lit)}
  .motions.open .m-toggle .caret{transform:rotate(180deg)}
  .motions .m-count{
    color:var(--accent-lit); font-weight:600;
    background:var(--accent-dim); padding:0 .4rem; border-radius:4px;
  }
  .motions .m-list{
    display:none; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.42rem;
    width:min(360px,calc(100vw - var(--page-x)*2));
    max-height:calc(100vh - var(--header-h) - 6rem); overflow-y:auto;
    padding:.75rem; border-radius:10px;
    background:rgba(30,15,22,.9); border:1px solid var(--line-lit);
    backdrop-filter:blur(12px); box-shadow:0 6px 18px rgba(0,0,0,.35);
    pointer-events:auto;
  }
  .motions.open .m-list{display:grid}
  .motions .m-list::-webkit-scrollbar{width:6px}
  .motions .m-list::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
  .motions .mgroup{
    grid-column:1/-1; font-family:var(--mono); font-size:.58rem; letter-spacing:.16em;
    color:var(--foam-dim); text-transform:uppercase; padding:.45rem .25rem .05rem;
  }
  .motions .mbtn{
    font-family:var(--mono); font-size:.68rem; letter-spacing:.04em;
    background:rgba(42,22,32,.92); border:1px solid var(--line-lit); color:var(--ivory);
    padding:.4rem .55rem; border-radius:4px; cursor:pointer; transition:.15s;
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .motions .mbtn:hover{border-color:var(--accent); color:var(--accent-lit); background:rgba(60,25,35,.95)}
  .motions .mbtn.on{background:var(--accent); color:var(--abyss); border-color:var(--accent); font-weight:600}
  @media(max-width:720px){
    .motions{top:3rem; right:.6rem}
    .motions .m-list{width:min(320px,calc(100vw - 1.2rem)); max-height:70vh}
  }

  /* 顶部分类导航 */
  .nav-tabs{margin-left:auto; display:flex; gap:.3rem; background:rgba(0,0,0,.25);
    padding:.28rem; border-radius:8px;}
  .nav-tabs button{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; color:var(--foam);
    background:transparent; border:none; padding:.42rem .8rem; border-radius:5px;
    cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .nav-tabs button:hover{color:var(--ivory)}
  .nav-tabs button.on{background:var(--accent); color:var(--abyss); font-weight:600}

  /* 工具栏：计数 + 筛选下拉 + 搜索 */
  .controls{display:flex; align-items:center; gap:.5rem; margin-left:auto; flex-wrap:wrap}
  .sortsel{
    font-family:var(--mono); font-size:.74rem; background:rgba(18,8,14,.6);
    border:1px solid var(--line); color:var(--ivory); padding:.48rem .6rem;
    border-radius:4px; outline:none; cursor:pointer; transition:.15s;
  }
  .sortsel:hover{border-color:var(--line-lit)}
  .sortsel:focus{border-color:var(--accent)}

  /* 互动栏 */
  .interact-bar{
    position:absolute; left:1.4rem; bottom:4.6rem;
    /* z-index 必须高于所有浮层（vb/mx/tl 都是 11~12），
       否则面板展开后会盖住按钮导致点不到（实测踩过）。 */
    z-index:20;
    display:flex; align-items:center; gap:.4rem; flex-wrap:wrap;
    background:rgba(30,15,22,.88); border:1px solid var(--line-lit);
    padding:.5rem .6rem; border-radius:8px; backdrop-filter:blur(10px);
    box-shadow:0 6px 18px rgba(0,0,0,.35); max-width:min(560px,calc(100vw - 2.8rem));
  }
  .ia-btn{
    font-family:var(--mono); font-size:.7rem; letter-spacing:.05em;
    background:rgba(42,22,32,.92); border:1px solid var(--line-lit); color:var(--ivory);
    padding:.36rem .62rem; border-radius:5px; cursor:pointer; transition:.15s;
    white-space:nowrap;
  }
  .ia-btn:hover{border-color:var(--accent); color:var(--accent-lit)}
  .ia-btn:active{transform:scale(.96)}
  .ia-btn.toggle{
    min-width:2.1rem; font-size:.86rem; line-height:1;
    color:var(--foam);
  }
  .ia-btn.toggle.on{
    background:var(--accent); color:var(--abyss); border-color:var(--accent); font-weight:600;
  }
  .ia-status{
    font-family:var(--mono); font-size:.66rem; color:var(--foam);
    letter-spacing:.03em; opacity:.85; margin-left:.3rem;
    /* ⚠️ 必须限宽且不收缩到撑破单行：状态文字变长（如「播放速度 0.1x」）
       会让 .interact-bar 因 flex-wrap:wrap 多出一行，高度 81→102px，
       top 上移到 825，正好压住底部浮层（.sp-preset 在 814~835）。
       实测这会让速度预设按钮 5/6 档点不到。
       这里用 flex-basis 固定 + flex-shrink:0 保证永远单行、宽度可控。 */
    max-width:11rem; flex:0 0 auto;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  @media(max-width:720px){
    .interact-bar{left:.6rem; right:.6rem; bottom:4rem; max-width:none}
    .ia-status{width:100%; max-width:none}
  }

  /* 语音全集面板 */
  .vb-panel{
    position:absolute; top:3.4rem; right:1.4rem; z-index:10;
    width:min(420px,calc(100vw - 2.8rem));
    /* 关键：必须给底部留出时间轴(约 80px) + 互动栏(约 60px) 的空间，
       否则面板会盖住按钮导致点不到（实测 1400x950 下 vb 高 756px 完全遮挡）。 */
    max-height:calc(100vh - var(--header-h) - 11rem);
    display:none; flex-direction:column;
    background:rgba(26,13,20,.96); border:1px solid var(--line-lit);
    border-radius:10px; backdrop-filter:blur(14px);
    box-shadow:0 12px 32px rgba(0,0,0,.55); overflow:hidden;
  }
  .vb-panel.on{display:flex}
  .vb-head{
    display:flex; align-items:center; gap:.5rem; padding:.6rem .7rem;
    border-bottom:1px solid var(--line); flex:none;
  }
  .vb-title{font-family:var(--mono); font-size:.74rem; letter-spacing:.08em; color:var(--accent-lit)}
  .vb-count{font-family:var(--mono); font-size:.62rem; color:var(--foam); opacity:.8}
  .vb-search{
    flex:1; min-width:0; font-family:var(--mono); font-size:.68rem;
    background:rgba(18,8,14,.7); border:1px solid var(--line); color:var(--ivory);
    padding:.28rem .45rem; border-radius:4px; outline:none;
  }
  .vb-search:focus{border-color:var(--accent)}
  .vb-close{
    font-family:var(--mono); font-size:.86rem; line-height:1; color:var(--foam);
    background:transparent; border:none; cursor:pointer; padding:.2rem .35rem;
  }
  .vb-close:hover{color:var(--accent-lit)}
  .vb-body{overflow-y:auto; padding:.5rem .6rem .7rem}
  .vb-body::-webkit-scrollbar{width:6px}
  .vb-body::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
  .vb-empty{font-family:var(--mono); font-size:.7rem; color:var(--foam);
    text-align:center; padding:1.2rem 0; opacity:.7}
  .vb-group{margin-bottom:.55rem}
  .vb-ghead{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:var(--mono); font-size:.6rem; letter-spacing:.1em;
    color:var(--foam-dim); text-transform:uppercase; padding:.25rem .2rem;
  }
  .vb-ghead b{color:var(--accent-lit); font-size:.64rem}
  .vb-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.3rem}
  .vb-item{
    display:flex; justify-content:space-between; align-items:center; gap:.3rem;
    font-family:var(--mono); font-size:.62rem; text-align:left;
    background:rgba(42,22,32,.9); border:1px solid var(--line); color:var(--ivory);
    padding:.32rem .42rem; border-radius:4px; cursor:pointer; transition:.13s;
    min-width:0;
  }
  .vb-item:hover{border-color:var(--accent); color:var(--accent-lit)}
  .vb-item.playing{background:var(--accent); color:var(--abyss); border-color:var(--accent); font-weight:600}
  .vb-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
  .vb-len{font-size:.56rem; color:var(--foam); opacity:.85; flex:none}
  .vb-item.playing .vb-len{color:var(--abyss); opacity:.9}

  /* 时间轴 scrub 面板 */
  .tl-panel{
    position:absolute; left:1.4rem; right:1.4rem; bottom:1.2rem; z-index:10;
    display:none; flex-direction:column; gap:.35rem;
    background:rgba(26,13,20,.94); border:1px solid var(--line-lit);
    border-radius:8px; padding:.5rem .7rem; backdrop-filter:blur(12px);
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  .tl-panel.on{display:flex}
  .tl-panel.paused{border-color:var(--accent)}
  .tl-row{display:flex; align-items:center; gap:.6rem}
  .tl-anim{
    font-family:var(--mono); font-size:.68rem; letter-spacing:.04em;
    color:var(--accent-lit); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .tl-time{font-family:var(--mono); font-size:.64rem; color:var(--foam); flex:none}
  .tl-range{
    -webkit-appearance:none; appearance:none; width:100%; height:4px;
    background:var(--line); border-radius:2px; outline:none; cursor:pointer;
  }
  .tl-range::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:var(--accent); border:2px solid var(--abyss); cursor:grab;
  }
  .tl-range::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%;
    background:var(--accent); border:2px solid var(--abyss); cursor:grab;
  }
  .tl-btns{gap:.32rem}
  .tl-btn{
    font-family:var(--mono); font-size:.7rem; line-height:1;
    background:rgba(42,22,32,.92); border:1px solid var(--line-lit); color:var(--ivory);
    padding:.3rem .5rem; border-radius:4px; cursor:pointer; transition:.13s;
  }
  .tl-btn:hover{border-color:var(--accent); color:var(--accent-lit)}
  .tl-btn:active{transform:scale(.95)}
  .tl-hint{
    font-family:var(--mono); font-size:.58rem; color:var(--foam);
    opacity:.8; margin-left:auto; letter-spacing:.03em;
  }
  .tl-panel.paused .tl-hint{color:var(--accent-lit); opacity:1}
  @media(max-width:720px){
    .tl-panel{left:.6rem; right:.6rem; bottom:.8rem}
  }

  /* 动画混合面板 */
  .mx-panel{
    position:absolute; top:3.4rem; left:1.4rem; z-index:10;
    width:min(360px,calc(100vw - 2.8rem));
    max-height:calc(100vh - var(--header-h) - 11rem);
    display:none; flex-direction:column;
    background:rgba(26,13,20,.96); border:1px solid var(--line-lit);
    border-radius:10px; backdrop-filter:blur(14px);
    box-shadow:0 12px 32px rgba(0,0,0,.55); overflow:hidden;
  }
  .mx-panel.on{display:flex}
  .mx-head{
    display:flex; align-items:center; gap:.5rem; padding:.55rem .7rem;
    border-bottom:1px solid var(--line);
  }
  .mx-title{font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; color:var(--accent-lit)}
  .mx-count{font-family:var(--mono); font-size:.6rem; color:var(--foam); opacity:.8; margin-left:auto}
  .mx-close{
    font-family:var(--mono); font-size:.82rem; color:var(--foam);
    background:transparent; border:none; cursor:pointer; padding:.1rem .3rem;
  }
  .mx-close:hover{color:var(--accent-lit)}
  .mx-body{padding:.6rem .7rem .75rem; display:flex; flex-direction:column; gap:.45rem}
  .mx-row{display:flex; align-items:center; gap:.45rem}
  .mx-label{font-family:var(--mono); font-size:.62rem; color:var(--foam); flex:none; width:4.2rem}
  .mx-range{
    -webkit-appearance:none; appearance:none; flex:1; height:4px;
    background:var(--line); border-radius:2px; outline:none; cursor:pointer;
  }
  .mx-range::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
    background:var(--accent); border:2px solid var(--abyss);
  }
  .mx-val{font-family:var(--mono); font-size:.6rem; color:var(--accent-lit); flex:none; width:3rem; text-align:right}
  .mx-sep{
    font-family:var(--mono); font-size:.56rem; letter-spacing:.1em;
    color:var(--foam-dim); text-transform:uppercase;
    border-top:1px solid var(--line); padding-top:.45rem; margin-top:.15rem;
  }
  .mx-select{
    flex:1; min-width:0; font-family:var(--mono); font-size:.62rem;
    background:rgba(18,8,14,.8); border:1px solid var(--line); color:var(--ivory);
    padding:.26rem .3rem; border-radius:4px; outline:none;
  }
  .mx-select:focus{border-color:var(--accent)}

  /* 平板及以下：两个侧边面板不能同时占同一水平带，改为 vb 移到右侧下方、
     mx 留在左上，且都不跨过底部操作区 */
  @media(max-width:900px){
    .vb-panel{width:min(320px,calc(100vw - 1.2rem)); right:.6rem; top:7.6rem;

              max-height:calc(100vh - 19rem)}

              max-height:calc(100vh - 23rem)}

     因此 mx 顶到最上、vb 紧贴其下，各自限高，靠 z-index 保证后开的在上面。 */

<script>
const POSE_LABEL = { fb: '立绘', cover: '半身', aim: '瞄准', skillcut: '技能演出' };

// 循环类动画（待机/站立）——这些应循环播放；其余（技能/攻击/一次性演出）单次播放。
// 兼容多种命名：idle / Idle / aim_idle / cover_idle / stand / standby / wait / loop
const LOOP_RE = /(^|_)(idle|stand|standby|wait|loop)(\b|_|$)/i;
const isLoopAnim = a => LOOP_RE.test(a);

// 找一个可循环的待机动画作为“回落”目标（技能/一次性动作播完后回到它）。
// 优先精确 idle 系列，其次任意循环类。
function findIdle(anims){
  return anims.find(a=>/(^|_)idle($|_)/i.test(a))   // idle / aim_idle / cover_idle / idle_1
      || anims.find(a=>isLoopAnim(a))               // 任意循环类
      || null;
}

// 进入某姿态时的默认动画：
//  - skillcut 姿态：默认直接播“技能演出”本身（skillcut_1 / 含 skillcut 的），
//    而不是待机——否则进了技能演出姿态却只看到 idle，很奇怪。
//  - 其它姿态：优先待机(idle)，否则第一个。
function pickDefaultAnim(anims, pose){
  if(pose === 'skillcut'){
    const sk = anims.find(a=>/skillcut/i.test(a)) || anims.find(a=>!isLoopAnim(a));
    if(sk) return sk;
  }
  return findIdle(anims) || anims[0];
}

// 播放动画：循环类直接循环；一次性动画播完后自动排队回落到 idle（模拟游戏内技能放完回待机）
function playAnim(pl, anims, name){
  const loop = isLoopAnim(name);
  pl.setAnimation(name, loop);
  if(!loop){
    const idle = findIdle(anims);
    if(idle && idle !== name){
      try{ pl.addAnimation(idle, true, 0); }catch(e){}   // 播完接 idle 循环
    }
  }
  pl.play();
}

// ═══ §4.5 姿态无缝切换（保留动画时间进度）═══════════════════════
//
// 背景：切 fb/cover/aim 时 loadPose() 会 dispose 旧 player、new 一个新 player。
// 旧实现里新 player 一律从动画 0 秒开始 → 视觉上「闪一下 / 跳回起点」。
//
// 做法：切换前把旧 player 的当前动画名 + 归一化相位(0..1) 记下来，
// 新 player 加载成功后：
//   1) 优先播【同名动画】（若新姿态有）
//   2) 否则按语义映射（idle→cover_idle/aim_idle、action→cover_reload 等）
//   3) 把新动画 seek 到相同相位（用 trackTime = 相位 × 新动画时长）
//
// 注意：三个姿态的 idle 动画时长不同（fb idle 3.33s / cover_idle 2.0s /
// aim_idle 2.0s），所以要用【归一化相位】而不是绝对秒数，否则会越界。
let poseHandoff = null;   // {fromPose, anim, phase, ts}

// 记录切换前的动画状态（在 disposePlayer 之前调用）
function capturePoseHandoff(fromPose){
  poseHandoff = null;
  try{
    const pl = (typeof player !== 'undefined') ? player : null;
    if(!pl) return;
    const e = pl.animationState.getCurrent(0);
    if(!e || !e.animation) return;
    const dur = e.animation.duration || 0;
    const phase = dur > 0 ? (e.trackTime % dur) / dur : 0;
    poseHandoff = {
      fromPose: fromPose || current.pose,
      anim: e.animation.name,
      phase: Math.max(0, Math.min(1, phase)),
      ts: performance.now(),
    };
  }catch(e){ poseHandoff = null; }
}

// 语义映射：旧姿态动画名 → 新姿态候选名（按优先级）
const POSE_ANIM_ALIAS = {
  idle:      ['idle', 'cover_idle', 'aim_idle', 'stand', 'wait'],
  cover_idle:['cover_idle', 'aim_idle', 'idle'],
  aim_idle:  ['aim_idle', 'cover_idle', 'idle'],
  action:    ['action', 'cover_reload', 'aim_fire', 'idle'],
};

/** 在新姿态的动画列表里挑一个与 handoff 最接近的 */
function pickHandoffAnim(anims, handoff, pose){
  if(!handoff) return null;
  const old = handoff.anim;
  // 1) 同名
  if(anims.includes(old)) return old;
  // 2) 别名表
  const alias = POSE_ANIM_ALIAS[old];
  if(alias){
    const hit = alias.find(a => anims.includes(a));
    if(hit) return hit;
  }
  // 3) 同类别启发式：把 idle / cover_idle / aim_idle 视为一类
  if(/idle/i.test(old)){
    const idleCand = anims.find(a => /idle/i.test(a));
    if(idleCand) return idleCand;
  }
  return null;   // 找不到就交给默认逻辑
}

/** 把新 player 的动画 seek 到 handoff 相位 */
function applyPoseHandoff(pl, anims, chosen){
  if(!poseHandoff || !chosen) return false;
  try{
    const a = pl.animationState.data.skeletonData.findAnimation(chosen);
    if(!a || !a.duration) return false;
    const e = pl.animationState.getCurrent(0);
    if(!e) return false;
    e.trackTime = poseHandoff.phase * a.duration;
    pl.animationState.apply(pl.skeleton);
    pl.skeleton.updateWorldTransform();
    return true;
  }catch(e){ return false; }
}

const CARD_COLS_KEY = 'nikke.cardColumns';
const CARD_COL_OPTIONS = [
  ['auto', '自动列数'], ['3', '每行 3 个'], ['4', '每行 4 个'], ['5', '每行 5 个'],
  ['6', '每行 6 个'], ['8', '每行 8 个'], ['10', '每行 10 个'],
];

let manifest = null;
let current = { idx: -1, pose: 'fb' };
let player = null;
let loadToken = 0;
const ui = { cat: 'all', pose: '', ver: '', sort: 'id', q: '' };

// ==================== 互动 ====================
let interaction = null;      // NikkeInteraction 实例
let loveMode = false;        // 触摸是否使用好感版
let voiceBrowser = null;     // VoiceBrowser 实例
let timelineScrubber = null; // TimelineScrubber 实例
let mixPanel = null;         // MixPanel 实例
let debugView = null;        // DebugView 实例
let poseActions = null;      // PoseActions 实例
let subtitle = null;         // SubtitleBubble 实例
let skinCompare = null;      // SkinCompare 实例
let playbackSpeed = 1.0;    // §6.6 全局播放速度（切姿态后仍生效）
let speedPanel = null;       // 速度面板 DOM
let shotPanel = null;        // §7 截图面板 DOM
let tfPanel = null;          // §6.5 旋转/镜像面板 DOM
let viewTransform = { rotate: 0, flipH: false, flipV: false };
let extrasHidden = false;    // 配件是否已隐藏
let extrasSaved = null;      // 被隐藏的 slot 原始 attachment

/**
 * 判断是否为「可隐藏的大件配件」slot。
 *
 * 实测各角色槽位命名毫无统一规范：
 *   c010  → acc_1 ~ acc_7, r_arm_1_acc, gun
 *   c080  → C_upper_acc01~03, C_necklace_01~03
 *   c381  → skirt_acc_1/2, breast_acc, hair_acc, ear_acc_1~3
 *   c521  → hat, dron_*, doll_*, cake_*, cherry_*, c_acc_1~7
 *   c132  → bg_prop / bg_front_prop / bg_prop_lit_1 / bg_prop_lit_2
 *
 * 注意：
 *   - 不能用 \b（`_` 是单词字符，`\bacc` 匹配不到 `_acc`）
 *   - `prop` 不能带下划线后缀（`bg_prop` 是 prop 结尾，不是 `prop_` 开头）
 *     审核实测：全库 1499 skel 里 `bgobj_` 命中 0，`prop_` 前缀只命中 2 个，
 *     而 `bg_prop` / `bg_front_prop` 两个主 slot 会被漏掉。
 */
const EXTRA_SUBSTR = [
  'acc',        // acc_1 / C_upper_acc01 / skirt_acc_2 / r_arm_1_acc
  'prop',       // bg_prop / bg_front_prop / bg_prop_lit_*（不能写 'prop_'，会漏主道具）
  'bgobj',      // 文档提到的命名（实测 0 个，保留兼容）
  'hat',        // hat / head_hat
  'dron',       // dron_* / drone2_*
  'doll',       // doll_*
  'cake',       // cake_*
  'cherry',     // cherry_*
  'ribon',      // ribon1_*
];

// 名称里含这些词的一律排除（即使含配件关键字）
//   hair 等身体部件：隐藏会让造型缺一块，保守起见不动
//   propeller：螺旋桨是角色本体的一部分（审核实测全库 16 个），不该算"配件"
const EXTRA_EXCLUDE = [
  'hair', 'eyeball', 'eyeline', 'brow', 'mouth', 'nose', 'face',
  'finger', 'shoulder', 'belly', 'boob',
  'propeller',
];

function isExtraSlot(name) {
  if (!name) return false;
  const low = name.toLowerCase();
  // 必须命中配件关键字
  if (!EXTRA_SUBSTR.some(k => low.includes(k))) return false;
  // 命中排除词则跳过。
  // 说明：这是【刻意的保守取舍】，不是遗漏的分支。
  // 例如 c381 的 hair_acc / hair_acc_sha、c521 的 hair_acc_1 其实是独立配件槽
  // （审核实测 setup == slot 名），但隐藏发饰会让发型缺一块，
  // 观感比"少隐藏一个"更差，所以宁可漏掉。
  // propeller（螺旋桨，全库 16 个）是角色本体的一部分，同理排除。
  if (EXTRA_EXCLUDE.some(w => low.includes(w))) {
    return false;
  }
  return true;
}

/**
 * 配件显隐。
 *
 * ⚠️ 关键坑（审核实测确认，必须这样写）：
 *   很多角色的配件 slot 在**所有动画**里都带 AttachmentTimeline。
 *   单纯 slot.setAttachment(null) 只在这一帧有效 —— 下一帧
 *   AnimationState.apply() → applyAttachmentTimeline() 会立刻把 setup 值写回去。
 *
 *   实测：c010 的 acc_1~acc_7 等 15 个 slot，setAttachment(null) 后
 *   getAttachment() 同步读回是 null（看起来成功），但 500ms 内 everNull=0，
 *   人物区像素变化仅 0.014% —— 完全没隐藏。
 *   c080 的 acc slot 没有 AttachmentTimeline，所以能保持 null，看起来"正常"。
 *
 *   修法：hook AnimationState.apply，每次 apply 之后强制把目标 slot 置 null。
 *   这是审核实测跑通的方案（c010: before_nonnull=15 → after_null=15, stayed_null=true）。
 */
let extrasHook = null;   // { state, origApply, targets:Set }

function _ensureExtrasHook() {
  const pl = interaction && interaction.player;
  if (!pl) return null;
  const st = pl.animationState;
  if (extrasHook && extrasHook.state === st) return extrasHook;

  // 新 player：重建 hook
  const hook = {
    state: st,
    origApply: st.apply.bind(st),
    targets: new Set(),
  };
  st.apply = function (...args) {
    const r = hook.origApply(...args);
    // apply 之后强制归 null，压过 AttachmentTimeline
    if (hook.targets.size) {
      for (const slot of hook.targets) {
        try { slot.setAttachment(null); } catch (e) {}
      }
    }
    return r;
  };
  extrasHook = hook;
  return hook;
}

function toggleExtras(hide) {
  const pl = interaction && interaction.player;
  if (!pl) return 0;
  let n = 0;
  try {
    const sk = pl.skeleton;
    if (!sk) return 0;
    const hook = _ensureExtrasHook();

    if (hide) {
      extrasSaved = extrasSaved || [];
      const targets = hook ? hook.targets : null;
      for (const slot of sk.slots) {
        const name = (slot.data && slot.data.name) || '';
        if (!isExtraSlot(name)) continue;
        const att = slot.getAttachment();
        if (!att) {
          // 这一帧没有附件，但可能下一帧被 timeline 挂上；
          // 仍然登记，保证 apply 后是 null
          if (targets) targets.add(slot);
          continue;
        }
        extrasSaved.push({ slot, att });
        slot.setAttachment(null);
        if (targets) targets.add(slot);
        n++;
      }
      // 立即再 apply 一次，让隐藏立刻体现在画面上
      if (hook) {
        try {
          hook.origApply(sk);
          sk.updateWorldTransform();
        } catch (e) {}
      }
    } else if (extrasSaved) {
      if (hook) hook.targets.clear();
      for (const { slot, att } of extrasSaved) {
        try { slot.setAttachment(att); n++; } catch (e) {}
      }
      extrasSaved = null;
      // 恢复后让 timeline 重新接管
      if (hook) {
        try {
          hook.origApply(sk);
          sk.updateWorldTransform();
        } catch (e) {}
      }
    }
  } catch (e) {
    console.warn('[extras]', e);
  }
  return n;
}

// ═══ §6.6 播放速度 ═══════════════════════════════════════════
//
// 用 animationState.timeScale 控制。spine-player 的 timeScale 在
// player 重建后会回到 1，所以保存在全局 playbackSpeed，
// 在 loadPose 的 success 回调里重新应用（见下方）。
const SPEED_PRESETS = [0.1, 0.25, 0.5, 1, 1.5, 2];

function applyPlaybackSpeed(pl, v){
  if(!pl) return false;
  try{
    // ⚠️ 只写 pl.speed，不要同时写 animationState.timeScale！
    // 实测：两者都会乘进渲染循环的 delta，双写会变成【平方减速】：
    //   只 timeScale=0.5 → 1s 推进 0.508 (正确)
    //   只 speed=0.5     → 1s 推进 0.500 (正确)
    //   双写 0.5/0.5     → 1s 推进 0.250 (0.25x，慢了一倍)
    // 0.1x 双写会变成 0.01x，几乎静止。
    // pl.speed 是 spine-player 的官方速度字段，且 player 重建后仍由本函数重设；
    // timeScale 保留给 timeline scrub / 定格等模块独立使用。
    pl.speed = v;
    return true;
  }catch(e){ return false; }
}

function setPlaybackSpeed(v, fromUi){
  v = Math.max(0.1, Math.min(2, parseFloat(v) || 1));
  playbackSpeed = v;
  const pl = interaction && interaction.player;
  applyPlaybackSpeed(pl, v);
  // 皮肤对比模式也同步
  if(skinCompare && skinCompare.isActive()) skinCompare.setSpeed(v);
  // UI
  const val = document.getElementById('sp-val');
  if(val) val.textContent = v.toFixed(2).replace(/0$/, '') + 'x';
  const range = document.getElementById('sp-range');
  if(range && !fromUi) range.value = v;
  document.querySelectorAll('.sp-preset').forEach(b =>
    b.classList.toggle('on', Math.abs(parseFloat(b.dataset.v) - v) < 0.001));
  setIaStatus(`播放速度 ${v}x`);
}

//
// 支持三种背景：
//   transparent —— 直接导出 canvas（透明底，PNG alpha 保留）
//   dark        —— 用 viewer 的深底色填充
//   white       —— 纯白底
// 做法是新建一个离屏 canvas，先填背景再 drawImage 主 canvas。

      <label class="shot-label">倍率</label>
      <select class="shot-sel" id="shot-scale">
        <option value="1">1x (原始)</option>

      </select>
    </div>

function exportScreenshot(){
  const pl = interaction && interaction.player;
  if(!pl || !pl.canvas){ setIaStatus('截图失败：没有可导出的画布'); return null; }
  const src = pl.canvas;
  const bgEl = document.getElementById('shot-bg');
  const scaleEl = document.getElementById('shot-scale');
  const bg = bgEl ? bgEl.value : 'dark';
  const scale = scaleEl ? parseFloat(scaleEl.value) : 1;

  try{
    const w = Math.round(src.width * scale);
    const h = Math.round(src.height * scale);
    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    const ctx = out.getContext('2d');
    // 背景
    if(bg === 'dark'){ ctx.fillStyle = '#160d16'; ctx.fillRect(0, 0, w, h); }
    else if(bg === 'white'){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); }
    // 主画面（放大时用平滑插值）
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, 0, 0, w, h);

    const url = out.toDataURL('image/png');
    // 文件名：角色_姿态_时间戳.png
    const c = manifest.characters[current.idx];
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    const name = `${c ? c.id : 'nikke'}_${current.pose}_${ts}.png`;
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setIaStatus(`已导出 ${name} (${w}×${h}, ${bg})`);
    return {name, w, h, bg, bytes: Math.round(url.length * 0.75)};
  }catch(e){
    setIaStatus('截图失败: ' + e.message);
    console.warn('[shot]', e);
    return null;
  }
}

// ═══ §6.5 旋转 / 镜像翻转 ═════════════════════════════════════
//
// 用 CSS transform 施加在 #player-container 上，不动 spine 内部坐标系。
// 这样点击互动（命中检测走的是骨架坐标）不受影响，字幕气泡的
// 投影也仍然正确（气泡是 position:fixed，不在被变换的容器内）。
//
// 注意：transform 会让 canvas 视觉旋转，但 canvas 的 getBoundingClientRect
// 会跟着变；截图导出用的是 canvas.width/height（未旋转的原始像素），
// 所以导出的是「未变换」的原始画面 —— 这是刻意的，避免导出的图被裁切。
function applyViewTransform(){
  const el = document.getElementById('player-container');
  if(!el) return;
  const t = viewTransform;
  const sx = t.flipH ? -1 : 1;
  const sy = t.flipV ? -1 : 1;
  el.style.transform = `rotate(${t.rotate}deg) scale(${sx}, ${sy})`;
  const rv = document.getElementById('tf-rot-v');
  if(rv) rv.textContent = t.rotate + '°';
  document.querySelectorAll('.tf-btn[data-tf]').forEach(b => {
    const k = b.dataset.tf;
    b.classList.toggle('on', (k === 'flipH' && t.flipH)
                          || (k === 'flipV' && t.flipV));
  });
}

function setViewTransform(patch){
  Object.assign(viewTransform, patch);
  if(viewTransform.rotate > 360) viewTransform.rotate -= 360;
  if(viewTransform.rotate < 0) viewTransform.rotate += 360;
  applyViewTransform();
  const r = document.getElementById('tf-rot');
  if(r) r.value = viewTransform.rotate;
  setIaStatus(`视角 旋转${viewTransform.rotate}° ${viewTransform.flipH?'水平镜像 ':''}${viewTransform.flipV?'垂直镜像':''}`);
}

function buildTfPanel(host){

      <label class="tf-label">旋转</label>

      <span class="tf-val" id="tf-rot-v">0°</span>
    </div>
    <div class="tf-actions">
      <button class="tf-btn" data-tf="flipH">左右翻转</button>
      <button class="tf-btn" data-tf="flipV">上下翻转</button>
    </div>
    <div class="tf-actions">
      <button class="tf-btn" id="tf-reset">复位</button>
    </div>`;
  host.appendChild(tfPanel);

  const closeEl = tfPanel.querySelector('#tf-close');
  closeEl.onclick = () => tfPanel.classList.remove('on');
  closeEl.onkeydown = (e) => {
    if(e.key === 'Enter' || e.key === ' ') tfPanel.classList.remove('on');

  tfPanel.querySelector('#tf-rot').oninput = (e) =>

  tfPanel.querySelectorAll('.tf-btn[data-tf]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.tf;
      setViewTransform({ [k]: !viewTransform[k] });
    };
  });
  tfPanel.querySelector('#tf-reset').onclick = () =>
    setViewTransform({ rotate: 0, flipH: false, flipV: false });
  return tfPanel;
}

function initInteraction(){
  interaction = new NikkeInteraction({
    dataDir: '../data',
    voiceDir: '../data/voice',
    onStatus: (msg) => {
      const el = document.getElementById('ia-status');
      if (el) el.textContent = msg;
    },
    // 语音播放时触发字幕（reaction_id 就是 clip 名）
    onVoice: (cid, clipName) => {
      if (!subtitle) initSubtitle();
      if (subtitle && subtitle.enabled) {
        subtitle.show(cid, clipName);
      }
    },
  });
  // 暴露到 window 便于调试/自动化测试
  window.__ia = interaction;

  // 按钮绑定
  document.querySelectorAll('.ia-btn[data-kind]').forEach(btn => {
    btn.onclick = () => {
      if (!interaction || !interaction.isSupported()) {
        setIaStatus('该角色无互动配置');
        return;
      }
      // loveMode 打开时，touch → touch_love，stay → stay_love
      let kind = btn.dataset.kind;
      if (loveMode && kind === 'touch') kind = 'touch_love';
      if (loveMode && kind === 'stay')  kind = 'stay_love';
      interaction.trigger(kind);
    };
  });

  const loveBtn = document.getElementById('ia-love');
  if (loveBtn) {
    loveBtn.onclick = () => {
      loveMode = !loveMode;
      loveBtn.classList.toggle('on', loveMode);
      setIaStatus(loveMode ? '好感模式：开' : '好感模式：关');
    };
  }

  // 口型开关
  const lipBtn = document.getElementById('ia-lip');
  if (lipBtn) {
    lipBtn.onclick = () => {
      const on = !lipBtn.classList.contains('on');
      lipBtn.classList.toggle('on', on);
      if (interaction && interaction.lipSync) {
        interaction.lipSync.setEnabled(on);
      }
      setIaStatus(on ? '口型：开' : '口型：关');
    };
  }

  // 配件显隐
  const extBtn = document.getElementById('ia-extras');
  if (extBtn) {
    extBtn.onclick = () => {
      extrasHidden = !extrasHidden;
      extBtn.classList.toggle('on', extrasHidden);
      const n = toggleExtras(extrasHidden);
      setIaStatus(extrasHidden ? `已隐藏 ${n} 个配件` : `已显示 ${n} 个配件`);
    };
  }

  // 语音全集面板
  const vbBtn = document.getElementById('ia-voice');
  if (vbBtn) {
    vbBtn.onclick = async () => {
      if (!voiceBrowser) initVoiceBrowser();
      const host = document.getElementById('stage-view');
      await voiceBrowser.mount(host);
      // 先设定角色，再渲染（mount 时的 charId 还是空的）
      const c = manifest.characters[current.idx];
      if (c) await voiceBrowser.setCharacter(c.id);
      voiceBrowser.render();
      // 窄屏互斥：面板会互相挤压，打开一个就关掉另一个
      if (window.innerWidth <= 900 && !voiceBrowser.panel.classList.contains('on')) {
        if (mixPanel) mixPanel.hide();
        const mxBtn2 = document.getElementById('ia-mix');
        if (mxBtn2) mxBtn2.classList.remove('on');
      }
      voiceBrowser.toggle();
      vbBtn.classList.toggle('on',
        voiceBrowser.panel && voiceBrowser.panel.classList.contains('on'));
    };
  }

  // 时间轴
  const tlBtn = document.getElementById('ia-timeline');
  if (tlBtn) {
    tlBtn.onclick = async () => {
      if (!timelineScrubber) initTimeline();
      const host = document.getElementById('stage-view');
      timelineScrubber.mount(host);
      if (interaction && interaction.player) {
        timelineScrubber.attach(interaction.player);
      }
      timelineScrubber.toggle();
      tlBtn.classList.toggle('on',
        timelineScrubber.panel && timelineScrubber.panel.classList.contains('on'));
    };
  }

  // 动画混合
  const mxBtn = document.getElementById('ia-mix');
  if (mxBtn) {
    mxBtn.onclick = () => {
      if (!mixPanel) initMixPanel();
      const host = document.getElementById('stage-view');
      mixPanel.mount(host);
      if (interaction && interaction.player) mixPanel.attach(interaction.player);
      mixPanel.mount(host);   // 重新 mount 以刷新动画下拉
      // 窄屏互斥：面板会互相挤压，打开一个就关掉另一个
      if (window.innerWidth <= 900 && !mixPanel.panel.classList.contains('on')) {
        if (voiceBrowser) voiceBrowser.hide();
        const vbBtn2 = document.getElementById('ia-voice');
        if (vbBtn2) vbBtn2.classList.remove('on');
      }
      mixPanel.toggle();
      mxBtn.classList.toggle('on',
        mixPanel.panel && mixPanel.panel.classList.contains('on'));
    };
  }

  // 骨骼调试
  const dbgBtn = document.getElementById('ia-debug');
  if (dbgBtn) {
    dbgBtn.onclick = () => {
      if (!debugView) initDebugView();
      const host = document.getElementById('stage-view');
      debugView.mount(host);
      if (interaction && interaction.player) debugView.attach(interaction.player);
      // 窄屏互斥
      if (window.innerWidth <= 900 && !debugView.panel.classList.contains('on')) {
        if (voiceBrowser) voiceBrowser.hide();
        if (mixPanel) mixPanel.hide();
        const vbBtn3 = document.getElementById('ia-voice');
        const mxBtn3 = document.getElementById('ia-mix');
        if (vbBtn3) vbBtn3.classList.remove('on');
        if (mxBtn3) mxBtn3.classList.remove('on');
      }
      debugView.toggle();
      dbgBtn.classList.toggle('on',
        debugView.panel && debugView.panel.classList.contains('on'));
    };
  }

  // 姿态动作
  const paBtn = document.getElementById('ia-pose-act');
  if (paBtn) {
    paBtn.onclick = () => {
      if (!poseActions) initPoseActions();
      const host = document.getElementById('stage-view');
      poseActions.mount(host);
      if (interaction && interaction.player) poseActions.attach(interaction.player);
      poseActions.rebuild();
      // 窄屏互斥
      if (window.innerWidth <= 900 && !poseActions.panel.classList.contains('on')) {
        if (voiceBrowser) voiceBrowser.hide();
        if (mixPanel) mixPanel.hide();
        if (debugView) debugView.hide();
        ['ia-voice', 'ia-mix', 'ia-debug'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.classList.remove('on');
        });
      }
      poseActions.toggle();
      paBtn.classList.toggle('on',
        poseActions.panel && poseActions.panel.classList.contains('on'));
    };
  }

  // 字幕开关
  const subBtn = document.getElementById('ia-sub');
  if (subBtn) {
    subBtn.onclick = () => {
      if (!subtitle) initSubtitle();
      const on = !subtitle.enabled;
      subtitle.setEnabled(on);
      subBtn.classList.toggle('on', on);
      if (!on) subtitle.hide();
      // 打开时同时显示控制面板
      if (on) subtitle.showPanel();
      else subtitle.hidePanel();
      setIaStatus(on ? '字幕：开' : '字幕：关');
    };
  }

  // 皮肤对比
  const scBtn = document.getElementById('ia-skin-compare');
  if (scBtn) {
    scBtn.onclick = async () => {
      if (!skinCompare) initSkinCompare();
      const c = manifest.characters[current.idx];
      if (!c) return;
      const active = await skinCompare.toggle(c.id, current.pose);
      scBtn.classList.toggle('on', !!active);
      // 打开对比后把全局播放速度同步过去（SkinCompare 内部初值是 1）
      if (active) skinCompare.setSpeed(playbackSpeed);
    };
  }

  // 播放速度
  const spBtn = document.getElementById('ia-speed');
  if (spBtn) {
    spBtn.onclick = () => {
      const host = document.getElementById('stage-view');
      const panel = buildSpeedPanel(host);
      panel.classList.toggle('on');
      spBtn.classList.toggle('on', panel.classList.contains('on'));
      // 打开时把当前实际速度同步到 UI
      if (panel.classList.contains('on')) setPlaybackSpeed(playbackSpeed);
    };
  }

  // 截图导出
  const shotBtn = document.getElementById('ia-shot');
  if (shotBtn) {
    shotBtn.onclick = () => {
      const host = document.getElementById('stage-view');
      const panel = buildShotPanel(host);
      panel.classList.toggle('on');
      shotBtn.classList.toggle('on', panel.classList.contains('on'));
    };
  }

  // 旋转 / 镜像
  const tfBtn = document.getElementById('ia-transform');
  if (tfBtn) {
    tfBtn.onclick = () => {
      const host = document.getElementById('stage-view');
      const panel = buildTfPanel(host);
      panel.classList.toggle('on');
      tfBtn.classList.toggle('on', panel.classList.contains('on'));
      if (panel.classList.contains('on')) applyViewTransform();
    };
  }

  // 点击画布触发互动
  const stage = document.querySelector('#stage-view .stage');
  if (stage) {
    let downX = 0, downY = 0, downT = 0;
    stage.addEventListener('pointerdown', e => {
      downX = e.clientX; downY = e.clientY; downT = Date.now();
    });
    stage.addEventListener('pointerup', e => {
      // 只认「短按且几乎没移动」，避免和拖拽冲突
      const dx = Math.abs(e.clientX - downX);
      const dy = Math.abs(e.clientY - downY);
      const dt = Date.now() - downT;
      if (dx > 6 || dy > 6 || dt > 500) return;
      if (!interaction || !interaction.isSupported()) return;
      const kind = loveMode ? 'touch_love' : 'touch';
      interaction.trigger(kind);
    });
  }
}

/** 进入某角色时刷新互动栏可用状态 */
async function updateInteractBar(){
  const bar = document.getElementById('interact-bar');
  if (!bar) return;
  if (!interaction) initInteraction();

  const c = manifest.characters[current.idx];
  if (!c) return;

  // 重置配件状态（换角色后 player 会重建）
  extrasHidden = false;
  extrasSaved = null;
  const extBtn = document.getElementById('ia-extras');
  if (extBtn) extBtn.classList.remove('on');

  // 语音全集面板跟随当前角色
  if (voiceBrowser) {
    await voiceBrowser.setCharacter(c.id);
    if (voiceBrowser.panel && voiceBrowser.panel.classList.contains('on')) {
      voiceBrowser.render();
    }
  }

  const cid = c.id;
  const reactions = await interaction.setCharacter(cid, current.pose);
  if (reactions && Object.keys(reactions).length) {
    const kinds = Object.keys(reactions).map(k =>
      `${k}×${reactions[k].length}`).join(' ');
    setIaStatus(`互动可用：${kinds}`);
    bar.style.opacity = '1';
    bar.style.pointerEvents = 'auto';
  } else {
    setIaStatus('该角色无互动配置');
  }
}

const CAT_NOUN = { all:'条目', character:'角色', event:'活动', story:'剧情', misc:'其它', fav:'收藏' };

// ═══ §8 最爱收藏系统 ═════════════════════════════════════════
// localStorage 存 id 数组；收藏分类 tab 走 applyFilters 的 ui.cat==='fav'。
const FAV_KEY = 'nikke.favorites';
let favorites = new Set();
let refreshGrid = null;      // buildGrid 里注册的刷新回调
try{
  const raw = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
  if(Array.isArray(raw)) favorites = new Set(raw);
}catch(e){ favorites = new Set(); }

function saveFavorites(){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); }
  catch(e){ console.warn('[fav] 保存失败', e); }
}
function isFav(id){ return favorites.has(id); }
function toggleFav(id){
  if(favorites.has(id)) favorites.delete(id);
  else favorites.add(id);
  saveFavorites();
  // 同步所有同名星标
  document.querySelectorAll(`.fav-star[data-fid="${id}"]`).forEach(el =>
    el.classList.toggle('on', favorites.has(id)));
  // 徽标即时更新（审核报的 P3：非收藏分类下点星时徽标不刷新，
  // 因为原先只在 buildGrid 的 reset() 里写。这里独立更新，不依赖分类）。
  updateFavBadge();
  // 若正在收藏分类且取消了收藏，刷新列表
  if(ui.cat === 'fav' && typeof refreshGrid === 'function') refreshGrid();
  return favorites.has(id);
}

/** 收藏 tab 的计数徽标（独立于 buildGrid，任何分类下都即时反映） */
function updateFavBadge(){
  const btn = document.getElementById('nav-fav');
  if(!btn) return;
  btn.textContent = favorites.size ? `⭐ 收藏 (${favorites.size})` : '⭐ 收藏';
}

function applyFilters(){
  let items = manifest.characters;
  if(ui.cat === 'fav') items = items.filter(c => favorites.has(c.id));
  else if(ui.cat !== 'all') items = items.filter(c => (c.category||'misc') === ui.cat);
  if(ui.pose) items = items.filter(c => c.poses && c.poses[ui.pose]);
  if(ui.ver)  items = items.filter(c => String(c.version) === ui.ver);
  if(ui.q){
    const q = ui.q;
    items = items.filter(c => c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q));
  }
  items = items.slice();
  if(ui.sort === 'name') items.sort((a,b)=>a.name.localeCompare(b.name));
  else if(ui.sort === 'poses') items.sort((a,b)=>Object.keys(b.poses).length-Object.keys(a.poses).length);
  else items.sort((a,b)=>a.id.localeCompare(b.id));
  return items;
}

function buildGrid(){
  const grid = document.getElementById('grid');
  const chars = manifest.characters;
  let filtered = chars, shown = 0;
  const PAGE = 48;
  const append = () => {
    filtered.slice(shown, shown+PAGE).forEach(c => {
      const idx = chars.indexOf(c);
      const poseKeys = Object.keys(c.poses||{});
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        `<div class="thumb">`+
          `<span class="badge">${c.version||''}</span>`+
          `<span class="fav-star${isFav(c.id)?' on':''}" data-fid="${c.id}" title="收藏/取消收藏">★</span>`+
          `<img loading="lazy" src="${c.cover||''}" alt="${c.name}">`+
          `<div class="poses">${poseKeys.map(p=>`<i${p===ui.pose?' class="hl"':''}>${POSE_LABEL[p]||p}</i>`).join('')}</div>`+
        `</div>`+
        `<div class="name">${c.name}${c.name!==c.id?` · ${c.id}`:''}</div>`;
      // 星标点击独立处理，不触发进入详情
      card.querySelector('.fav-star').onclick = (e) => {
        e.stopPropagation();
        toggleFav(c.id);
      };
      card.onclick = () => enterStage(idx, ui.pose || null);
      grid.appendChild(card);
    });
    shown += Math.min(PAGE, filtered.length - shown);
  };
  const reset = () => {
    filtered = applyFilters(); shown = 0; grid.innerHTML = '';
    if(ui.cat === 'fav' && !filtered.length){
      grid.innerHTML = '<div class="fav-empty">还没有收藏 ⭐<br>点卡片右上角的星标即可加入</div>';
    } else {
      append();
    }
    document.getElementById('count').textContent = `${filtered.length} ${CAT_NOUN[ui.cat]||'条目'}`;
    // 收藏数徽标（与 toggleFav 里的 updateFavBadge 同一实现）
    updateFavBadge();
  };
  refreshGrid = reset;   // 供 toggleFav 在收藏分类下刷新
  new IntersectionObserver(e=>{ if(e[0].isIntersecting && shown<filtered.length) append(); },{rootMargin:'400px'})
    .observe(document.getElementById('sentinel'));

  // 顶部分类导航
  document.querySelectorAll('#nav-tabs button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#nav-tabs button').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      ui.cat = btn.dataset.cat; reset();
    };
  });
  // 筛选/排序下拉
  document.getElementById('filter-pose').onchange = e => { ui.pose = e.target.value; reset(); };
  document.getElementById('filter-ver').onchange  = e => { ui.ver = e.target.value; reset(); };
  document.getElementById('sort-by').onchange     = e => { ui.sort = e.target.value; reset(); };
  // 搜索
  let t;
  document.getElementById('search').oninput = () => { clearTimeout(t); t=setTimeout(()=>{
    ui.q = document.getElementById('search').value.trim().toLowerCase(); reset();
  }, 180); };

  reset();
}

function enterStage(i, preferPose){
  current.idx = i;
  const c = manifest.characters[i];
  // 默认姿态：筛选指定 > fb > 第一个
  current.pose = (preferPose && c.poses[preferPose]) ? preferPose
    : (c.poses.fb ? 'fb' : Object.keys(c.poses)[0]);
  document.getElementById('grid-view').style.display = 'none';
  document.getElementById('stage-view').style.display = 'block';
  buildPoseTabs(c);
  updateInteractBar();
  setTimeout(()=> loadPose(), 30);
}

function exitStage(){
  // 退出对比模式（若处于对比中），否则残留的多个 player 会一直渲染
  if (skinCompare && skinCompare.isActive()) skinCompare.close();
  const scBtn = document.getElementById('ia-skin-compare');
  if (scBtn) scBtn.classList.remove('on');
  disposePlayer();
  if (interaction) interaction.stop();
  document.getElementById('stage-view').style.display = 'none';
  document.getElementById('grid-view').style.display = 'block';
}

function buildPoseTabs(c){
  const tabs = document.getElementById('pose-tabs');
  tabs.innerHTML = '';
  Object.keys(c.poses).forEach(pose => {
    const b = document.createElement('button');
    b.textContent = POSE_LABEL[pose] || pose;
    b.classList.toggle('on', pose === current.pose);
    b.onclick = () => {
      // 皮肤对比模式下忽略姿态切换（对比面板自己管理姿态），
      // 否则会白白重建一个主 player，且对比状态与 current.pose 不一致。
      if (skinCompare && skinCompare.isActive()) return;
      if(pose === current.pose) return;
      // §4.5：切姿态前记录当前动画相位，供新 player 无缝接续
      capturePoseHandoff(current.pose);
      current.pose = pose;
      tabs.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      loadPose();
    };
    tabs.appendChild(b);
  });
}

function disposePlayer(){
  if(player){
    try{ player.dispose(); }catch(e){}
    player = null;
  }
  document.getElementById('player-container').innerHTML = '';
  const panel = document.getElementById('motion-panel');
  panel.innerHTML = '';
  panel.classList.remove('open');
}

// Spine 动作控制台：折叠开关 + 分组紧凑网格（参考 azur_lane live2d 动作面板）。
// 点击 chip 播放动画并高亮；一次性动画（技能演出等）播完自动回落到 idle 并把高亮移到 idle。
function buildMotionPanel(pl, anims, activeAnim){
  const panel = document.getElementById('motion-panel');
  panel.innerHTML = '';
  panel.classList.remove('open');
  if(!anims || !anims.length) return;

  // 分类：待机(idle) / 技能演出(skillcut) / 触摸(touch/talk) / 其他
  const cats = { idle:[], skill:[], touch:[], other:[] };
  anims.forEach(a => {
    if(isLoopAnim(a)) cats.idle.push(a);
    else if(/skillcut|skill|burst|attack|fire|shot|shoot|action|special/i.test(a)) cats.skill.push(a);
    else if(/touch|talk|blink|face|emotion/i.test(a)) cats.touch.push(a);
    else cats.other.push(a);
  });
  const natural = (a,b)=>a.localeCompare(b,undefined,{numeric:true});
  Object.values(cats).forEach(arr=>arr.sort(natural));

  // 折叠开关
  const toggle = document.createElement('button');
  toggle.className = 'm-toggle';
  toggle.innerHTML = `动作 <span class="m-count">${anims.length}</span><span class="caret">▾</span>`;
  toggle.onclick = () => panel.classList.toggle('open');
  panel.appendChild(toggle);

  // 按钮网格
  const list = document.createElement('div');
  list.className = 'm-list';
  panel.appendChild(list);

  const highlight = (name) => {
    list.querySelectorAll('.mbtn').forEach(x=>x.classList.toggle('on', x.dataset.anim === name));
  };

  // 一次性动画播完 → addAnimation 会自动接 idle；把高亮同步到实际播放的 idle
  try{
    pl.animationState.addListener({
      complete: (entry) => {
        if(entry.loop) return;                 // 循环动画的每轮 complete 不处理
        const idle = findIdle(anims);
        if(idle) highlight(idle);              // 回落到 idle，高亮随之切换
      }
    });
  }catch(e){}

  const makeBtn = a => {
    const btn = document.createElement('button');
    btn.className = 'mbtn';
    btn.dataset.anim = a;
    btn.textContent = a;
    btn.title = a;
    btn.classList.toggle('on', a === activeAnim);
    btn.onclick = () => {
      highlight(a);
      try{ playAnim(pl, anims, a); }
      catch(e){ console.error('playAnim', a, e); }
    };
    return btn;
  };
  const addGroup = (label, arr) => {
    if(!arr.length) return;
    const h = document.createElement('div');
    h.className = 'mgroup';
    h.textContent = `${label} · ${arr.length}`;
    list.appendChild(h);
    arr.forEach(a => list.appendChild(makeBtn(a)));
  };
  addGroup('待机', cats.idle);
  addGroup('技能演出', cats.skill);
  addGroup('触摸', cats.touch);
  addGroup('其他', cats.other);

  // 默认展开，让动作列表一目了然（比 spine-player 右下角控件更明显）
  panel.classList.add('open');
}

function setLoading(on, msg, isErr){
  const el = document.getElementById('loading');
  el.classList.toggle('on', on);
  el.classList.toggle('err', !!isErr);
  if(msg) el.textContent = msg;
}

async function loadPose(){
  const tk = ++loadToken;
  const c = manifest.characters[current.idx];
  const info = c.poses[current.pose];
  if(!info){ setLoading(true, '该姿态无资源', true); return; }

  disposePlayer();
  setLoading(true, '加载模型…');

  const sub = info.sub ? info.sub + '/' : '';
  const base = `${c.dir}/${sub}`;
  const skelUrl = base + info.skel;
  const atlasUrl = base + info.atlas;

  document.getElementById('ver-badge').textContent = `Spine ${info.version}`;

  try {
    // 读取 skel 为 arraybuffer -> 检测版本 + 转 base64 dataURI
    const buf = await (await fetch(skelUrl)).arrayBuffer();
    if(tk !== loadToken) return;

    const versionString = new TextDecoder().decode(new Uint8Array(buf).slice(0, 16)).replace(/\0/g,'');
    let runtime;
    if(/4\.0\.\d+/.test(versionString)) runtime = spine40;
    else if(/4\.1\.\d+/.test(versionString)) runtime = spine41;
    else runtime = (info.version === '4.0') ? spine40 : spine41;

    const dataUri = await blobToDataURL(new Blob([buf]));
    if(tk !== loadToken) return;

    // 关键：spine-player 在构造时按容器 clientWidth/Height 分配 WebGL 画布，
    // 若此刻容器尺寸为 0（stage 刚 display 出来）会退化成 300x150。
    // 等到容器有真实尺寸再构造。
    await waitForSize('player-container');
    if(tk !== loadToken) return;

    const key = `${c.id}_${current.pose}`;
    player = new runtime.SpinePlayer('player-container', {
      skelUrl: key,
      rawDataURIs: { [key]: dataUri },
      atlasUrl,
      // 不在构造时指定 animation：若名字不存在 spine-player 会直接报错。
      // 统一在 success 里根据实际可用动画智能选择。
      premultipliedAlpha: true,
      alpha: true,
      backgroundColor: '#00000000',
      mipmaps: current.pose === 'fb',
      preserveDrawingBuffer: true,
      showControls: false,
      defaultMix: 0.25,
      success: (pl) => {
        if(tk!==loadToken) return;
        setLoading(false);
        try{
          const anims = pl.animationState.data.skeletonData.animations.map(a=>a.name);
          // 把 player 交给互动模块
          if (interaction) interaction.attachPlayer(pl);
          // 时间轴也重新绑定（姿态切换后 player 是新的）
          if (timelineScrubber) timelineScrubber.attach(pl);
          // 混合面板也重新绑定
          if (mixPanel) mixPanel.attach(pl);
          // 骨骼调试也重新绑定（新 player 需要重新应用开关）
          if (debugView) debugView.attach(pl);
          // 姿态动作重新绑定（cover/aim 的动画清单不同）
          if (poseActions) { poseActions.attach(pl); poseActions.rebuild(); }
          // 字幕气泡跟随新 player 的骨骼
          if (!subtitle) initSubtitle();
          if(!anims.length){ buildMotionPanel(pl, [], null); return; }
          // §4.5：优先用旧姿态的动画名/语义别名，并把相位接续过去，
          // 避免切换时从 0 秒重播导致「闪一下」。
          let pick = pickHandoffAnim(anims, poseHandoff, current.pose);
          let handoffApplied = false;
          if(pick){
            playAnim(pl, anims, pick);
            handoffApplied = applyPoseHandoff(pl, anims, pick);
          }else{
            pick = pickDefaultAnim(anims, current.pose);
            playAnim(pl, anims, pick);
          }
          poseHandoff = null;   // 一次性，用完即清
          // §6.6：player 重建后 timeScale 回到 1，重新应用全局速度
          applyPlaybackSpeed(pl, playbackSpeed);
          buildMotionPanel(pl, anims, pick);
          if(handoffApplied) setIaStatus(`姿态已切换 · 动画相位已接续`);
        }catch(e){ buildMotionPanel(pl, [], null); }
      },
      error: (pl, msg) => { if(tk===loadToken) setLoading(true, '加载失败: ' + (msg||''), true); },
    });
  } catch(e){
    if(tk===loadToken) setLoading(true, '加载失败: ' + e.message, true);
  }
}

function blobToDataURL(blob){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}

function waitForSize(id){
  return new Promise(res => {
    const el = document.getElementById(id);
    let tries = 0;
    const check = () => {
      if((el.clientWidth > 1 && el.clientHeight > 1) || tries++ > 60) res();
      else requestAnimationFrame(check);
    };
    requestAnimationFrame(check);
  });
}

boot();
</script>
